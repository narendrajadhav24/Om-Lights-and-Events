<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Orders | Om Lights & Events</title>
<style>
:root{--gold:#f5b841;--ink:#111;--cream:#faf7f0;--paper:#fff;--muted:#716c63;--line:#e9e3d8;--green:#1b9a4a;--red:#c62828;--blue:#276ef1}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}button,input,select{font:inherit}.admin-header{background:#111;color:#fff;padding:15px clamp(16px,5vw,50px);display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:19px}.brand span{color:var(--gold)}.header-actions{display:flex;gap:8px}.header-actions a,.logout{border:1px solid #444;background:#1c1c1c;color:#fff;padding:9px 13px;border-radius:8px;text-decoration:none;cursor:pointer}.logout{background:#b51f2a;border-color:#b51f2a}.wrap{max-width:1250px;margin:auto;padding:30px 18px}.title{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:20px}.title h1{font-size:32px}.title p{color:var(--muted)}.toolbar{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{padding:11px 12px;border:1px solid var(--line);border-radius:8px;outline:none;background:#fff}.toolbar input{min-width:240px;flex:1}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px}.orders{display:grid;gap:15px}.order-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 25px rgba(30,25,15,.05)}.order-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.order-id{font-size:18px;font-weight:900}.date{font-size:12px;color:var(--muted)}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase}.status-new{background:#fff3cd;color:#8a5b00}.status-contacted{background:#e9f2ff;color:#1e5ab6}.status-confirmed{background:#e8f8ed;color:#17763a}.status-completed{background:#dff7e7;color:#126c34}.status-cancelled{background:#ffe8e8;color:#a51e1e}.order-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.detail{padding:12px;border-radius:10px;background:#fafafa}.detail small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800;margin-bottom:3px}.detail strong{word-break:break-word}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.order-actions button,.order-actions a{border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none}.contact{background:#e9f2ff;color:#1857b0}.wa{background:#dff7e7;color:#176b36}.save{background:#111;color:#fff}.delete{background:#ffe8e8;color:#a51e1e}.empty{background:#fff;border:1px dashed #d8d0c1;border-radius:15px;padding:40px;text-align:center;color:var(--muted)}.error{background:#fff0f0;color:#b51f2a;border-radius:10px;padding:12px;margin-bottom:15px;display:none}@media(max-width:800px){.order-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.title{display:block}.title h1{font-size:26px}.order-grid{grid-template-columns:1fr}.order-top{display:block}.status{margin-top:8px}.toolbar input{min-width:100%}}
</style>
</head>
<body>
<header class="admin-header">
<div class="brand">OM LIGHTS <span>& EVENTS</span></div>
<div class="header-actions">
<a href="admin-dashboard.html">Dashboard</a>
<a href="index.html">Website</a>
<button class="logout" id="logoutButton">Logout</button>
</div>
</header>

<main class="wrap">
<div class="title">
<div><h1>Customer Orders</h1><p>Manage WhatsApp enquiries and orders saved from the website.</p></div>
</div>
<div class="error" id="errorMessage"></div>
<div class="toolbar">
<input id="searchOrders" type="search" placeholder="Search customer, phone, product, order ID…">
<select id="statusFilter">
<option value="all">All statuses</option>
<option value="new">New</option>
<option value="contacted">Contacted</option>
<option value="confirmed">Confirmed</option>
<option value="completed">Completed</option>
<option value="cancelled">Cancelled</option>
</select>
</div>
<div class="summary" id="summary"></div>
<div class="orders" id="ordersList"><div class="empty">Loading orders…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://vazizqotfjxrljhdwlbo.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_ZqJHDTw3NXW0kl51M2SDEg_q3VlGHwp";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let orders=[];

function esc(v){if(v===null||v===undefined)return "";return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function money(v){return "₹"+Number(v||0).toLocaleString("en-IN")}
function statusClass(s){return "status-"+String(s||"new").toLowerCase()}
function showError(m){const e=document.getElementById("errorMessage");e.textContent=m;e.style.display="block"}

async function requireAdmin(){
 const {data,error}=await supabaseClient.auth.getSession();
 if(error||!data.session){location.href="admin-login.html";return false}
 const {data:admin,error:adminError}=await supabaseClient.rpc("is_admin");
 if(adminError||admin!==true){await supabaseClient.auth.signOut();location.href="admin-login.html?error=not-admin";return false}
 return true;
}

async function loadOrders(){
 const {data,error}=await supabaseClient.from("orders").select("*").order("created_at",{ascending:false});
 if(error){console.error(error);showError(error.message);return}
 orders=data||[];renderOrders();
}

function renderOrders(){
 const query=document.getElementById("searchOrders").value.trim().toLowerCase();
 const status=document.getElementById("statusFilter").value;
 const filtered=orders.filter(o=>{
   const hay=[o.id,o.customer_name,o.customer_phone,o.product_name,o.customer_address].join(" ").toLowerCase();
   return (!query||hay.includes(query))&&(status==="all"||o.status===status);
 });
 const counts={new:0,contacted:0,confirmed:0,completed:0,cancelled:0};
 orders.forEach(o=>{if(counts[o.status]!==undefined)counts[o.status]++});
 document.getElementById("summary").innerHTML=
   `<span class="pill">Total: <strong>${orders.length}</strong></span>`+
   `<span class="pill">New: <strong>${counts.new}</strong></span>`+
   `<span class="pill">Confirmed: <strong>${counts.confirmed}</strong></span>`+
   `<span class="pill">Completed: <strong>${counts.completed}</strong></span>`;
 const list=document.getElementById("ordersList");
 if(!filtered.length){list.innerHTML='<div class="empty">No orders match your filter.</div>';return}
 list.innerHTML="";
 filtered.forEach(o=>{
   const card=document.createElement("article");card.className="order-card";
   const wa=`https://wa.me/91${encodeURIComponent(String(o.customer_phone).replace(/\D/g,""))}?text=${encodeURIComponent("Hello "+o.customer_name+", this is Om Lights and Events regarding order #"+o.id+" for "+o.product_name+".")}`;
   card.innerHTML=`
    <div class="order-top">
      <div><div class="order-id">Order #${o.id}</div><div class="date">${new Date(o.created_at).toLocaleString("en-IN")}</div></div>
      <span class="status ${statusClass(o.status)}">${esc(o.status)}</span>
    </div>
    <div class="order-grid">
      <div class="detail"><small>Customer</small><strong>${esc(o.customer_name)}</strong></div>
      <div class="detail"><small>Phone</small><strong>${esc(o.customer_phone)}</strong></div>
      <div class="detail"><small>Product</small><strong>${esc(o.product_name)}</strong></div>
      <div class="detail"><small>Quantity</small><strong>${esc(o.quantity)}</strong></div>
      <div class="detail"><small>Unit Price</small><strong>${money(o.product_price)}</strong></div>
      <div class="detail"><small>Total</small><strong>${money(o.total_amount)}</strong></div>
      <div class="detail"><small>Status</small>
        <select data-status-id="${o.id}">
          ${["new","contacted","confirmed","completed","cancelled"].map(s=>`<option value="${s}" ${o.status===s?"selected":""}>${s}</option>`).join("")}
        </select>
      </div>
      <div class="detail"><small>Address</small><strong>${esc(o.customer_address)}</strong></div>
    </div>
    <div class="order-actions">
      <a class="contact" href="tel:${esc(o.customer_phone)}">📞 Call</a>
      <a class="wa" href="${wa}" target="_blank" rel="noopener">💬 WhatsApp</a>
      <button class="save" data-save-id="${o.id}">Save Status</button>
    </div>`;
   list.appendChild(card);
 });
 document.querySelectorAll("[data-save-id]").forEach(btn=>btn.addEventListener("click",()=>updateStatus(btn.dataset.saveId)));
}

async function updateStatus(id){
 const select=document.querySelector(`[data-status-id="${CSS.escape(String(id))}"]`);
 if(!select)return;
 const {error}=await supabaseClient.from("orders").update({status:select.value}).eq("id",id);
 if(error){showError(error.message);return}
 await loadOrders();
}

document.getElementById("searchOrders").addEventListener("input",renderOrders);
document.getElementById("statusFilter").addEventListener("change",renderOrders);
document.getElementById("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();location.href="admin-login.html"});
(async()=>{if(await requireAdmin()) await loadOrders()})();
</script>
</body>
</html>
